version: 2

project_name: secentral

snapshot:
  name_template: "dev+{{ .ShortCommit }}"

builds:
  - id: agent
    main: ./cmd/secentral-agent
    binary: secentral-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64
      - s390x
  - id: catalog-collector
    main: ./cmd/secentral-catalog-collector
    binary: secentral-catalog-collector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - ppc64
      - s390x

archives:
  - id: agent
    builds:
      - agent
    name_template: "{{ .ProjectName }}-agent-{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: contrib/systemd/secentral-agent.service
        dst: systemd/secentral-agent.service
      - src: contrib/systemd/agent.env
        dst: systemd/agent.env
  - id: catalog-collector
    builds:
      - catalog-collector
    name_template: "{{ .ProjectName }}-catalog-collector-{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  abbrev: 7
  format: '[{{ .SHA }}](https://github.com/SECentral/agent/commit/{{ .SHA }}) - {{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}'
